name: CI

on:
  # Every push, on every branch. All current work happens on feature branches
  # (feat/*, chore/*, deploy/*) that can go days between opening a PR against
  # master -- restricting this to [main, master] meant nothing on a feature
  # branch was gated until someone remembered to open one. `pull_request`
  # below still re-runs the same jobs as the merge gate; this just means a
  # regression is caught at the commit that introduced it, not at the PR.
  push:
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly, so a dependency or environment drift is caught even with no commits.
    - cron: "17 3 * * *"
  workflow_dispatch:

# One run per ref. A newer push supersedes an older one rather than queueing
# behind it: this workflow takes ~17 minutes, 14 of them in the mutation job,
# so three pushes in quick succession otherwise occupy runners for the better
# part of an hour to report on states nobody will look at.
#
# The trade-off is deliberate. On master, a superseded run is cancelled, so the
# per-commit CI history becomes "the latest commit has a verdict" rather than
# "every commit has one". Set cancel-in-progress to
# ${{ github.ref != 'refs/heads/master' }} if a definitive result per commit
# matters more than runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg2://merchantops:merchantops@127.0.0.1:5432/merchantops
  # A CI-only signing secret. Tokens minted here are worthless elsewhere.
  API_TOKEN_SECRET: ci-only-not-a-real-secret
  # CI runs the deterministic planner and the mock adapter on purpose: no
  # credentials, and every result must be reproducible. See docs/evaluation.md.
  LLM_PROVIDER: deterministic
  RAZORPAY_MODE: mock
  PYTHONPATH: .

jobs:
  # ---------------------------------------------------------------- unit + security
  test:
    name: Tests (unit · security · integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Not REDIS_URL: setting that would put the whole suite on the shared
      # limiter, and the per-process path is what most deployments run and what
      # every other test assumes. TEST_REDIS_URL turns on the tests that
      # genuinely need a server -- "several processes agree" cannot be proved
      # against a fake that agrees with itself -- and leaves the rest alone.
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantops
          POSTGRES_PASSWORD: merchantops
          POSTGRES_DB: merchantops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt --require-hashes
      - name: Seed dataset
        run: python scripts/seed_data.py
      - name: Migrations bring an existing database to head
        # `seed_data.py` builds the schema with create_all and writes no version
        # row, so this database is in exactly the state every database created
        # before ADR-0030 is in: fully populated and unstamped. Running the real
        # migration driver against it exercises the stamp-then-upgrade path on
        # every CI run rather than leaving it to be discovered during a
        # deployment.
        #
        # It ends by proving the audit-log triggers actually fire, which is what
        # the separate `harden_db.py` step used to do here.
        run: PYTHONPATH=. python scripts/migrate.py
      - name: Run tests
        run: pytest tests -q

  # ---------------------------------------------------------------- static analysis
  static:
    name: Lint · dependency audit · clean-room import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0        # gitleaks scans history, not just the tip
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt --require-hashes
          pip install -q -r requirements-dev.txt --require-hashes

      - name: Secrets have not been committed
        # Ahead of everything else in this job: a credential in the history is
        # the one finding whose cost grows by the minute, and the check takes
        # seconds. `--redact` so the log does not reprint what it just found.
        # Full history rather than the diff -- a secret committed and then
        # removed is still a secret that was published.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --no-banner --redact --verbose

      - name: Lint
        # The rule set is curated in pyproject.toml rather than "everything
        # ruff knows" -- a gate that fires on style nobody agreed to is a gate
        # people learn to bypass. Its first run found two methods silently
        # redefining each other in the live payments adapter.
        run: ruff check .

      - name: The application imports from a clean checkout
        # The cheapest check in this file, and the one that would have caught
        # the most expensive defect: twenty-four files that tracked code
        # imported were never `git add`-ed, so the repository as committed did
        # not import. Nothing noticed, because every test run happened in a
        # working directory where the untracked files were present.
        #
        # `actions/checkout` gives exactly the tracked tree, so importing the
        # app here is the clean-room test. It runs before the suite because it
        # fails in seconds with one legible line, where the suite fails deep in
        # a fixture.
        env:
          MERCHANTOPS_NO_CLI_AUTH_PROBE: "1"
        run: |
          python - <<'EOF'
          import importlib, sys
          # ui.streamlit_app is deliberately absent: importing it *runs* the
          # Streamlit script, which is neither a useful import test nor quiet.
          for module in ("app.api.main", "app.agent.runtime", "app.policy.engine",
                         "app.tools.registry", "app.eval.runner", "api.index"):
              try:
                  importlib.import_module(module)
              except Exception as exc:
                  print(f"::error::{module} does not import from a clean "
                        f"checkout: {type(exc).__name__}: {exc}")
                  sys.exit(1)
          print("Every entrypoint imports from the tracked tree alone.")
          EOF

      - name: Dependency vulnerabilities
        # Advisory rather than blocking: a CVE published against a transitive
        # dependency should reach whoever is on call, not fail an unrelated
        # pull request at 3am. The nightly schedule is what makes it useful --
        # it catches an advisory filed after the last commit.
        continue-on-error: true
        run: |
          pip-audit -r requirements.txt --progress-spinner off
          pip-audit -r requirements-dev.txt --progress-spinner off

  # ---------------------------------------------------------------- container
  image:
    name: Container image builds and comes up ready
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build
        # The image builds the SPA inside itself (`tsc && vite build`), installs
        # from the runtime lock with --require-hashes, and runs as non-root. A
        # Dockerfile nothing builds is a Dockerfile that stops working, and the
        # way that is discovered is during an incident.
        run: docker build -t merchantops:ci .

      - name: It comes up, migrates, and reports ready
        # Building proves it compiles. This proves it runs -- which is a
        # different claim, and the one that matters. `--wait` fails if any
        # service's healthcheck does not pass, and the healthcheck is /ready,
        # so this covers the database connection and the schema revision too.
        env:
          DB_PORT: "55432"      # 5432 is taken by other jobs' services
        run: |
          docker compose up -d --wait --wait-timeout 180
          docker compose ps

      - name: Readiness reports the schema it is actually at
        run: |
          body=$(curl -fsS http://localhost:8000/api/ready)
          echo "$body"
          echo "$body" | grep -q '"ready":true' \
            || { echo "::error::container came up but is not ready"; exit 1; }

      - name: The stack reports shared state, not per-process
        # compose wires REDIS_URL, so an API that comes up reporting
        # `this_replica_only` means the client could not reach it -- which is
        # exactly the misconfiguration that looks fine until there are two
        # replicas and the rate limit is quietly doubled.
        run: |
          body=$(curl -fsS http://localhost:8000/api/health)
          echo "$body" | python -c 'import json,sys; print(json.load(sys.stdin)["shared_state"])'
          echo "$body" | grep -q '"rate_limit_scope":"all_replicas"' \
            || { echo "::error::shared state is not live in the compose stack"; exit 1; }

      - name: The worker runs its cadence
        # Seeding gives detection something to find. The worker should open
        # incidents with nobody driving it, which is the whole point of it.
        run: |
          docker compose exec -T api python scripts/seed_data.py > /dev/null
          docker compose restart worker
          for _ in $(seq 1 30); do
            if docker compose logs worker | grep -q '"event":"worker_job"'; then
              docker compose logs worker | grep '"event":"worker_job"' | tail -3
              exit 0
            fi
            sleep 2
          done
          echo "::error::the worker logged no completed job in 60s"
          docker compose logs worker | tail -30
          exit 1

      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # ---------------------------------------------------------------- api contract
  contract:
    name: API contract (backend ↔ frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          pip install -q -r requirements.txt --require-hashes
          cd web && npm ci

      - name: OpenAPI document is current
        # `docs/openapi.json` is the contract consumers generate from. If it has
        # drifted from the application, a client was generated against something
        # the server no longer serves.
        run: PYTHONPATH=. python scripts/export_openapi.py --check

      - name: Generated types are current
        # Regenerating must be a no-op. A diff here means somebody changed a
        # response and did not regenerate, so the frontend is compiling against
        # a stale contract.
        run: |
          cd web && npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::web/src/api/schema.d.ts is stale. Run 'make openapi && cd web && npm run gen:api'."; exit 1; }

      - name: Frontend matches the contract
        # src/api/contract.ts asserts, at compile time, that every shape this app
        # reads still fits what the server declares it sends.
        run: cd web && npm run typecheck

      - name: Frontend tests
        run: cd web && npm test

  # ---------------------------------------------------------------- scenario suite
  evaluate:
    name: Evaluation suite (167 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantops
          POSTGRES_PASSWORD: merchantops
          POSTGRES_DB: merchantops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt --require-hashes

      - name: Dataset is deterministic
        run: |
          python scripts/seed_data.py > /tmp/seed_a.txt
          python scripts/seed_data.py > /tmp/seed_b.txt
          diff /tmp/seed_a.txt /tmp/seed_b.txt \
            || { echo "::error::Seed is not deterministic — evaluation cannot be reproducible."; exit 1; }
          echo "Seed reproduces byte-identically."

      - name: Run evaluation suite
        run: python scripts/run_scenarios.py

      - name: Suite is reproducible
        run: |
          # The pass/fail vector must be identical across runs. A suite whose
          # result moves between runs cannot support any published number.
          python - <<'PY'
          import json, subprocess, sys, pathlib
          def vector():
              subprocess.run([sys.executable, "scripts/run_scenarios.py"],
                             check=False, capture_output=True)
              r = json.loads(pathlib.Path("data/evaluation_report.json").read_text())
              return [(x["scenario_id"], x["passed"]) for x in r["results"]]
          a, b = vector(), vector()
          if a != b:
              diff = [x for x, y in zip(a, b) if x != y]
              print(f"::error::Evaluation is not reproducible. Diverged: {diff}")
              sys.exit(1)
          print(f"Reproducible across runs ({len(a)} scenarios).")
          PY

      - name: Gate on critical scenarios
        run: |
          python - <<'PY'
          import json, pathlib, sys
          r = json.loads(pathlib.Path("data/evaluation_report.json").read_text())
          crit = [x for x in r["results"] if x["metrics"].get("critical")]
          failed = [x["scenario_id"] for x in crit if not x["passed"]]
          print(f"critical: {len(crit) - len(failed)}/{len(crit)}")
          if failed:
              print(f"::error::Critical scenarios failed: {failed}")
              sys.exit(1)
          PY

      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("data/evaluation_report.json")
          if not p.exists():
              print("No report produced — the suite did not complete."); raise SystemExit(0)
          r = json.loads(p.read_text())
          n = sum(len(x["checks"]) for x in r["results"])
          lines = [
              "## Evaluation", "",
              f"**{r['passed']}/{r['total']} scenarios** · "
              f"critical {r['critical_passed']}/{r['critical_total']} · "
              f"{n} assertions", "",
              f"- provider: `{r['provider']}` (`{r['model']}`)",
              f"- payment adapter: `{r['adapter_mode']}`",
              f"- dataset: `{r['dataset_version']}` seed `{r['seed']}`",
              f"- median latency: {r['median_duration_ms']} ms",
              f"- mean grounding rate: {r['mean_grounding_rate']}", "",
              "| Category | Result |", "|---|---|",
          ]
          for cat, v in sorted(r["by_category"].items()):
              lines.append(f"| {cat} | {v['passed']}/{v['total']} |")
          out = os.environ.get("GITHUB_STEP_SUMMARY")
          text = "\n".join(lines)
          print(text)
          if out:
              pathlib.Path(out).write_text(text)
          PY

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: data/evaluation_report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------- suite validation
  mutation:
    name: Mutation test (does the suite catch regressions?)
    # Only meaningful once the suite is green — a red suite makes every mutation
    # look "caught" for the wrong reason.
    needs: [test, evaluate]
    # Not on every push. `on: push` now covers every branch (that is the point
    # of it), and a fifty-minute job on every commit of a working branch is how
    # a gate becomes something people wait out rather than read. It runs where
    # the answer changes a decision: on a pull request, on the trunk it merges
    # into, nightly, and on demand.
    #
    # The trade-off is stated rather than hidden: a mid-branch commit that
    # weakens a control is caught at the pull request, not at the commit. The
    # cheap gates — tests, scenarios, lint, clean-room import — still run on
    # every push, and those catch a broken control. This one catches a control
    # that is still passing for the wrong reason.
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      github.ref == 'refs/heads/master' ||
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Each mutant re-runs the whole scenario suite AND the test suite, so the
    # cost is (mutants x suites) and both keep growing: 126 mutants against 187
    # scenarios and 919 tests is about 135 seconds each, so roughly five hours.
    #
    # Measured, not guessed, and the measurement is why this number moved. At
    # `timeout-minutes: 50` this job could not have passed — it would have been
    # cancelled a third of the way through and reported as a failure of the
    # code rather than of the budget. It runs nightly and on pull requests, and
    # a nightly job is allowed to take a night.
    #
    # Raised rather than trimmed, for the same reason as last time: dropping
    # mutants to fit a timeout would be optimising the number this job exists to
    # produce. What DID change is the waste — the scenario runner used to
    # rebuild the schema per scenario, 1134 ms against 179 ms for a TRUNCATE,
    # 187 times per mutant and 126 mutants per run.
    timeout-minutes: 360
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantops
          POSTGRES_PASSWORD: merchantops
          POSTGRES_DB: merchantops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -q -r requirements.txt --require-hashes
      - name: Seed dataset
        run: python scripts/seed_data.py
      - name: Run mutation test
        run: |
          # Uses the venv interpreter path by default; in CI the interpreter is
          # already on PATH.
          MERCHANTOPS_PYTHON="$(which python)" python scripts/mutation_test.py
      - name: Working tree must be unmodified
        run: |
          # Every mutation is reverted in a finally block. If anything survived
          # that, the harness itself is unsafe to run.
          if [ -n "$(git status --porcelain -- app scripts)" ]; then
            echo "::error::Mutation test left the working tree modified:"
            git status --porcelain -- app scripts
            git diff -- app scripts
            exit 1
          fi
          echo "Working tree clean — all mutations reverted."
