name: CI

on:
  # Every push, on every branch. All current work happens on feature branches
  # (feat/*, chore/*, deploy/*) that can go days between opening a PR against
  # master -- restricting this to [main, master] meant nothing on a feature
  # branch was gated until someone remembered to open one. `pull_request`
  # below still re-runs the same jobs as the merge gate; this just means a
  # regression is caught at the commit that introduced it, not at the PR.
  push:
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly, so a dependency or environment drift is caught even with no commits.
    - cron: "17 3 * * *"
  workflow_dispatch:

# One run per ref. A newer push supersedes an older one rather than queueing
# behind it: this workflow takes ~17 minutes, 14 of them in the mutation job,
# so three pushes in quick succession otherwise occupy runners for the better
# part of an hour to report on states nobody will look at.
#
# The trade-off is deliberate. On master, a superseded run is cancelled, so the
# per-commit CI history becomes "the latest commit has a verdict" rather than
# "every commit has one". Set cancel-in-progress to
# ${{ github.ref != 'refs/heads/master' }} if a definitive result per commit
# matters more than runner time.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql+psycopg2://merchantops:merchantops@127.0.0.1:5432/merchantops
  # A CI-only signing secret. Tokens minted here are worthless elsewhere.
  API_TOKEN_SECRET: ci-only-not-a-real-secret
  # CI runs the deterministic planner and the mock adapter on purpose: no
  # credentials, and every result must be reproducible. See docs/evaluation.md.
  LLM_PROVIDER: deterministic
  RAZORPAY_MODE: mock
  PYTHONPATH: .

jobs:
  # ---------------------------------------------------------------- unit + security
  test:
    name: Tests (unit · security · integration)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantops
          POSTGRES_PASSWORD: merchantops
          POSTGRES_DB: merchantops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        # From the lock, with hashes. `requirements.txt` is a set of `>=`
        # constraints -- installing from it resolves to whatever PyPI has
        # that morning, so two runs of the SAME COMMIT could run different
        # code. For a repository whose evaluation suite publishes a number,
        # that is not a detail.
        run: pip install -q --require-hashes -r requirements.lock
      - name: Seed dataset
        run: python scripts/seed_data.py
      - name: Migrations bring an existing database to head
        # `seed_data.py` builds the schema with create_all and writes no version
        # row, so this database is in exactly the state every database created
        # before ADR-0030 is in: fully populated and unstamped. Running the real
        # migration driver against it exercises the stamp-then-upgrade path on
        # every CI run rather than leaving it to be discovered during a
        # deployment.
        #
        # It ends by proving the audit-log triggers actually fire, which is what
        # the separate `harden_db.py` step used to do here.
        run: PYTHONPATH=. python scripts/migrate.py
      - name: Run tests
        # `--no-skips`, effectively. The one legitimate skip in this suite is
        # the migration tests' "the role cannot create databases", which is a
        # property of somebody's local Postgres and never of CI -- the service
        # container's role owns the database. So a skip here means a test
        # stopped running for a reason nobody chose, and `pytest -q` reports
        # that as a quiet "N passed, 2 skipped" that reads like success.
        #
        # This was not hypothetical: a local run said "624 passed, 2 skipped"
        # where every previous run said 626, and the summary named neither
        # which two nor why.
        run: |
          # pipefail, or `tee` decides the exit code and a RED suite reports
          # success. Actions' default shell is `bash -e`, which does not set it.
          set -o pipefail
          pytest tests -q | tee /tmp/pytest.txt
          if grep -qE '[0-9]+ skipped' /tmp/pytest.txt; then
            echo "::error::Tests were skipped in CI. A skipped test is a test that did not run:"
            grep -E '[0-9]+ skipped' /tmp/pytest.txt
            echo "Re-run with -rs to see which and why."
            exit 1
          fi

      - name: The operator scripts still run
        # Five entry points that nothing exercised. They are not library code
        # -- they touch the models, the adapter, detection and the approval
        # path directly -- so a renamed field breaks them silently and the
        # first person to notice is whoever is demonstrating the system.
        #
        # `demo.py` is the §51 scripted walkthrough and is run LAST, on a
        # freshly seeded database, because it needs duplicates nobody has
        # refunded yet. It used to print "(no approval created — skipping)"
        # and exit 0 in that situation, which let a viewer conclude they had
        # seen the whole loop including the UNKNOWN section they had not.
        #
        # `razorpay_spike.py` is deliberately absent: it writes
        # docs/assessment/razorpay-spike.md, and a CI step that dirties a
        # tracked file is a CI step that fights the working-tree checks.
        run: |
          set -o pipefail
          python scripts/demo_state.py > /dev/null
          python scripts/confirm_mappings.py
          python scripts/reconcile.py
          SEED_FORCE=1 python scripts/seed_data.py > /dev/null
          python scripts/demo.py > /dev/null
          echo "demo_state, confirm_mappings, reconcile and demo all ran."

      - name: Published numbers match the tree
        # The README is the only thing most readers check, and a repository
        # that publishes a number it cannot reproduce is making exactly the
        # claim this project exists to refuse -- asserting a fact without
        # reading it back. Three claims were stale when this was written, and
        # one line in the file disagreed with another.
        #
        # Here rather than in `static` because collecting the Python suite
        # needs a reachable database, and this job has one. The Vitest count is
        # skipped where `web/node_modules` is absent; the `contract` job is
        # where the frontend is installed.
        run: python scripts/check_counts.py

  # ---------------------------------------------------------------- static analysis
  static:
    name: Lint · dependency audit · clean-room import
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          pip install -q --require-hashes -r requirements.lock
          pip install -q ruff pip-audit uv

      - name: Lint the shell
        # `scripts/run_e2e.sh` stands up a database, an API, a built bundle and
        # a browser. Its first shellcheck run found a real one: an environment
        # prefix where `E2E_API="$API_ORIGIN"` expanded the PARENT shell rather
        # than the assignment on the line above it (SC2097/SC2098). It was
        # correct only because API_ORIGIN happened to be set higher up; reorder
        # that and the suite drives an empty origin while every journey still
        # reports a result.
        run: |
          # The wheel ships the binary on PATH; there is no importable module.
          pip install -q shellcheck-py
          shellcheck scripts/*.sh

      - name: Lint
        # The rule set is curated in pyproject.toml rather than "everything
        # ruff knows" -- a gate that fires on style nobody agreed to is a gate
        # people learn to bypass. Its first run found two methods silently
        # redefining each other in the live payments adapter.
        run: ruff check .

      - name: The application imports from a clean checkout
        # The cheapest check in this file, and the one that would have caught
        # the most expensive defect: twenty-four files that tracked code
        # imported were never `git add`-ed, so the repository as committed did
        # not import. Nothing noticed, because every test run happened in a
        # working directory where the untracked files were present.
        #
        # `actions/checkout` gives exactly the tracked tree, so importing the
        # app here is the clean-room test. It runs before the suite because it
        # fails in seconds with one legible line, where the suite fails deep in
        # a fixture.
        env:
          MERCHANTOPS_NO_CLI_AUTH_PROBE: "1"
        run: |
          python - <<'EOF'
          import importlib, sys
          # ui.streamlit_app is deliberately absent: importing it *runs* the
          # Streamlit script, which is neither a useful import test nor quiet.
          for module in ("app.api.main", "app.agent.runtime", "app.policy.engine",
                         "app.tools.registry", "app.eval.runner", "api.index"):
              try:
                  importlib.import_module(module)
              except Exception as exc:
                  print(f"::error::{module} does not import from a clean "
                        f"checkout: {type(exc).__name__}: {exc}")
                  sys.exit(1)
          print("Every entrypoint imports from the tracked tree alone.")
          EOF

      - name: The DEPLOYED bundle imports from its own dependencies alone
        # `api/requirements.txt` is what @vercel/python installs -- six direct
        # requirements against the root set's thirteen, because a serverless
        # bundle has a size limit and shipping pytest and Streamlit to
        # production is how a 30-second cold start happens.
        #
        # Nothing checked it. The clean-room import above proves `api.index`
        # imports with the FULL development set installed, which is a different
        # claim: add an import to `app/` that needs a package only the root set
        # carries and every job here stays green while the deploy breaks. So
        # this installs the deployment lock and nothing else, into its own
        # interpreter, and imports the entrypoint.
        run: |
          python -m venv /tmp/bundle
          /tmp/bundle/bin/pip install -q --upgrade pip
          /tmp/bundle/bin/pip install -q --require-hashes -r api/requirements.lock
          MERCHANTOPS_NO_CLI_AUTH_PROBE=1 PYTHONPATH=. /tmp/bundle/bin/python -c "
          import api.index
          print('api.index imports from the deployment bundle alone.')
          "

      - name: No mutant is committed
        # The check that would have caught it. `scripts/mutation_test.py`
        # rewrites files under `app/` for two hours at a time, and on
        # 2026-09-08 a `git add -A` during a run pushed
        # `Decision.ALLOW,  # MUTANT` -- the mutation that removes the human
        # approval gate on high-risk financial actions. It was found by reading
        # `git show --name-only` afterwards, which is not a control.
        #
        # Compared against the harness's own MUTATIONS list rather than grepped
        # for a marker, so it cannot drift from what the harness can apply.
        run: python scripts/check_no_mutants.py

      - name: The lock is current
        # `uv pip compile` prefers the pins already in the output file, so
        # recompiling is a no-op unless `requirements.txt` changed. That makes
        # this a real check rather than a race against PyPI: it fails when
        # somebody adds a dependency and does not regenerate, and stays quiet
        # when an unrelated package publishes a release.
        run: |
          uv pip compile requirements.txt --generate-hashes \
            --python-version 3.12 -o requirements.lock -q
          uv pip compile api/requirements.txt --generate-hashes \
            --python-version 3.12 -o api/requirements.lock -q
          git diff --exit-code -- requirements.lock api/requirements.lock \
            || { echo "::error::A lock file is stale. Run 'make lock'."; exit 1; }

      - name: Dependency vulnerabilities (what ships)
        # BLOCKING, and only defensible because the set is pinned. It used to
        # audit `requirements.txt`, whose `>=` constraints resolve to whatever
        # PyPI has that morning -- so failing on it really would have failed
        # unrelated pull requests at 3am, and it was left advisory for that
        # reason and then never read. A locked set only changes when somebody
        # changes it, so a finding here is either a new advisory against a
        # version we chose (which the nightly schedule surfaces, and which
        # somebody should look at) or a regression somebody just introduced.
        run: |
          pip-audit -r requirements.lock --progress-spinner off
          # And the bundle that actually reaches production, which is a
          # different and smaller set. Auditing only the development lock
          # would be auditing the machine nobody deploys.
          pip-audit -r api/requirements.lock --progress-spinner off

      - name: Dependency vulnerabilities (the whole environment)
        # Advisory, and a different question: `-r` audits the packages the
        # application declares, and this audits everything actually installed
        # -- including `pip` itself, which carried seven advisories when this
        # was written and which no requirements-file audit can ever see.
        # Not blocking, because the runner's own toolchain is not something a
        # pull request can fix.
        continue-on-error: true
        run: pip-audit --progress-spinner off

  # ---------------------------------------------------------------- api contract
  contract:
    name: API contract (backend ↔ frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v5
        with:
          # Vitest 5 requires ^22.12 || ^24 || >=26, and 24 is what
          # development runs -- a CI Node that differs from the one the
          # suite is written against is a second environment nobody tests.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          pip install -q --require-hashes -r requirements.lock
          cd web && npm ci

      - name: OpenAPI document is current
        # `docs/openapi.json` is the contract consumers generate from. If it has
        # drifted from the application, a client was generated against something
        # the server no longer serves.
        run: PYTHONPATH=. python scripts/export_openapi.py --check

      - name: Generated types are current
        # Regenerating must be a no-op. A diff here means somebody changed a
        # response and did not regenerate, so the frontend is compiling against
        # a stale contract.
        run: |
          cd web && npm run gen:api
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::web/src/api/schema.d.ts is stale. Run 'make openapi && cd web && npm run gen:api'."; exit 1; }

      - name: Frontend matches the contract
        # src/api/contract.ts asserts, at compile time, that every shape this app
        # reads still fits what the server declares it sends.
        run: cd web && npm run typecheck

      - name: Frontend lint
        # The frontend's equivalent of the `static` job's ruff step, and
        # curated the same way -- see `web/eslint.config.js`, which records the
        # ten React-Compiler findings that were read and deliberately not
        # adopted. What is enforced is rules-of-hooks and exhaustive-deps
        # (promoted from the plugin's own "warn"), because an effect that reads
        # an undeclared value is a queue refreshing on the wrong schedule.
        run: cd web && npm run lint

      - name: Frontend tests
        run: cd web && npm test

      - name: Frontend dependency vulnerabilities
        # Blocking, unlike `pip-audit` above, and the difference is the
        # threshold rather than a difference of opinion about noise. pip-audit
        # reports every advisory at any severity, so failing on it would fail
        # unrelated pull requests for a low-severity transitive finding. This
        # gate fires only on HIGH or CRITICAL in a dependency that ships to the
        # browser, which is small enough a set to be worth stopping for.
        #
        # The two moderate `react-router` advisories currently open are
        # deliberately below this line -- they are assessed and documented in
        # the README's known limitations rather than silenced here. `make
        # web-audit-all` prints everything, including dev dependencies.
        run: cd web && npm audit --omit=dev --audit-level=high

  # ---------------------------------------------------------------- browser e2e
  browser:
    name: Browser journeys (§22)
    # Only after the contract job: if the generated types are stale or the
    # frontend does not compile, every journey fails for a reason that has
    # nothing to do with the seams these exist to test.
    needs: [contract]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantops
          POSTGRES_PASSWORD: merchantops
          POSTGRES_DB: merchantops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v5
        with:
          # Vitest 5 requires ^22.12 || ^24 || >=26, and 24 is what
          # development runs -- a CI Node that differs from the one the
          # suite is written against is a second environment nobody tests.
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: |
          pip install -q --require-hashes -r requirements.lock
          cd web && npm ci

      - name: Install the browser
        # Chromium only. The journeys test seams between our own layers, not
        # rendering differences between engines, and three browsers would
        # triple the run to re-answer the same question.
        run: cd web && npx playwright install --with-deps chromium

      - name: Run the five journeys and the accessibility scans
        # `run_e2e.sh` owns the whole fixture: it creates its own database,
        # seeds it, runs detection, plants the one UNKNOWN action journey D
        # needs through the real execution path, starts the API and takes it
        # all down again. Nothing here reaches into those steps, because a
        # workflow that reimplements half the script is a second fixture to
        # keep in step with the first.
        env:
          PY: python
          E2E_DATABASE_URL: postgresql+psycopg2://merchantops:merchantops@127.0.0.1:5432/merchantops_e2e
        run: ./scripts/run_e2e.sh

      - name: Upload the trace of anything that failed
        # `trace: "retain-on-failure"`. A browser failure read from a log line
        # is a guess; the trace is the actual DOM, network and console at the
        # moment it went wrong, and it is the only artifact that makes a
        # once-a-week flake diagnosable.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-trace
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore

  # ---------------------------------------------------------------- scenario suite
  evaluate:
    name: Evaluation suite (167 scenarios)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantops
          POSTGRES_PASSWORD: merchantops
          POSTGRES_DB: merchantops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -q --require-hashes -r requirements.lock

      - name: Dataset is deterministic
        run: |
          python scripts/seed_data.py > /tmp/seed_a.txt
          python scripts/seed_data.py > /tmp/seed_b.txt
          diff /tmp/seed_a.txt /tmp/seed_b.txt \
            || { echo "::error::Seed is not deterministic — evaluation cannot be reproducible."; exit 1; }
          echo "Seed reproduces byte-identically."

      - name: The suite asserts what it appears to
        # Before running it, because a green 167/167 from scenarios that grade
        # nothing is the most expensive kind of wrong. Four ways that happens
        # and none is visible in the result: a mistyped `expect` key silently
        # dropped, a field declared on `Expect` that `runner.py` never reads,
        # an empty `expect`, and two scenarios sharing an id.
        #
        # `Expect` inherits pydantic's `extra="ignore"`, which is what makes
        # the first one possible. `app/api/schemas.py` solved exactly that for
        # responses with `extra="forbid"`; the evaluation schema never got the
        # same treatment.
        run: python scripts/check_scenarios.py

      - name: Run evaluation suite
        run: python scripts/run_scenarios.py

      - name: Suite is reproducible
        run: |
          # The pass/fail vector must be identical across runs. A suite whose
          # result moves between runs cannot support any published number.
          python - <<'PY'
          import json, subprocess, sys, pathlib
          def vector():
              subprocess.run([sys.executable, "scripts/run_scenarios.py"],
                             check=False, capture_output=True)
              r = json.loads(pathlib.Path("data/evaluation_report.json").read_text())
              return [(x["scenario_id"], x["passed"]) for x in r["results"]]
          a, b = vector(), vector()
          if a != b:
              diff = [x for x, y in zip(a, b) if x != y]
              print(f"::error::Evaluation is not reproducible. Diverged: {diff}")
              sys.exit(1)
          print(f"Reproducible across runs ({len(a)} scenarios).")
          PY

      - name: Gate on critical scenarios
        run: |
          python - <<'PY'
          import json, pathlib, sys
          r = json.loads(pathlib.Path("data/evaluation_report.json").read_text())
          crit = [x for x in r["results"] if x["metrics"].get("critical")]
          failed = [x["scenario_id"] for x in crit if not x["passed"]]
          print(f"critical: {len(crit) - len(failed)}/{len(crit)}")
          if failed:
              print(f"::error::Critical scenarios failed: {failed}")
              sys.exit(1)
          PY

      - name: Published scenario numbers match the run
        # Here rather than only in the `test` job, because this is where
        # `data/evaluation_report.json` exists. Without it the README's
        # "167/167 scenarios passed (critical: 110/110)" and its eleven
        # per-category rows were compared to nothing -- the earlier check read
        # the numerator and compared it to the YAML's TOTAL, so the line would
        # have passed whether or not 167 actually did.
        run: python scripts/check_counts.py

      - name: Summary
        if: always()
        run: |
          python - <<'PY'
          import json, os, pathlib
          p = pathlib.Path("data/evaluation_report.json")
          if not p.exists():
              print("No report produced — the suite did not complete."); raise SystemExit(0)
          r = json.loads(p.read_text())
          n = sum(len(x["checks"]) for x in r["results"])
          lines = [
              "## Evaluation", "",
              f"**{r['passed']}/{r['total']} scenarios** · "
              f"critical {r['critical_passed']}/{r['critical_total']} · "
              f"{n} assertions", "",
              f"- provider: `{r['provider']}` (`{r['model']}`)",
              f"- payment adapter: `{r['adapter_mode']}`",
              f"- dataset: `{r['dataset_version']}` seed `{r['seed']}`",
              f"- median latency: {r['median_duration_ms']} ms",
              f"- mean grounding rate: {r['mean_grounding_rate']}", "",
              "| Category | Result |", "|---|---|",
          ]
          for cat, v in sorted(r["by_category"].items()):
              lines.append(f"| {cat} | {v['passed']}/{v['total']} |")
          out = os.environ.get("GITHUB_STEP_SUMMARY")
          text = "\n".join(lines)
          print(text)
          if out:
              pathlib.Path(out).write_text(text)
          PY

      - name: Upload evaluation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: evaluation-report
          path: data/evaluation_report.json
          if-no-files-found: warn

  # ---------------------------------------------------------------- suite validation
  mutation:
    name: Mutation test (does the suite catch regressions?)
    # Only meaningful once the suite is green — a red suite makes every mutation
    # look "caught" for the wrong reason.
    needs: [test, evaluate]
    runs-on: ubuntu-latest
    # Each mutant re-runs the whole scenario suite AND the test suite, so the
    # cost is (mutants x suites) and both keep growing: 88 mutants against 167
    # scenarios and 626 tests. The complete run of 2026-09-08 took 2h06m on a
    # developer machine, which is why this is 180 and not 50 -- the previous
    # value would have killed the job partway and reported a timeout where the
    # answer was "87 caught, 1 survived".
    #
    # Raised rather than trimmed, every time. Dropping mutants to fit a timeout
    # would be optimising the number this job exists to produce.
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: merchantops
          POSTGRES_PASSWORD: merchantops
          POSTGRES_DB: merchantops
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install dependencies
        run: pip install -q --require-hashes -r requirements.lock
      - name: Seed dataset
        run: python scripts/seed_data.py
      - name: Run mutation test
        run: |
          # Uses the venv interpreter path by default; in CI the interpreter is
          # already on PATH.
          MERCHANTOPS_PYTHON="$(which python)" python scripts/mutation_test.py
      - name: Published mutation result matches the run
        # The number the README publishes, checked against the file the run
        # just wrote -- here rather than in the `test` job because this is
        # where the report exists. Everywhere else the check prints that no run
        # was recorded and moves on, which is why a contributor does not have
        # to sit through two hours to make the cheap check pass.
        run: python scripts/check_counts.py

      - name: Upload the mutation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: data/mutation_report.json
          if-no-files-found: warn

      - name: Working tree must be unmodified
        run: |
          # Every mutation is reverted in a finally block. If anything survived
          # that, the harness itself is unsafe to run.
          if [ -n "$(git status --porcelain -- app scripts)" ]; then
            echo "::error::Mutation test left the working tree modified:"
            git status --porcelain -- app scripts
            git diff -- app scripts
            exit 1
          fi
          echo "Working tree clean — all mutations reverted."
