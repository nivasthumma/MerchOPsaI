# Alembic configuration — ADR-0030.
#
# `sqlalchemy.url` is deliberately absent. The URL comes from app.config, which
# already resolves it from the environment, so a migration can never be applied
# to a different database than the one the application talks to. A URL here
# would be a second source of truth for the one question where being wrong is
# unrecoverable.

[alembic]
script_location = alembic
prepend_sys_path = .
# `path_separator` is the current spelling; without it alembic falls back to
# splitting on spaces and commas, which breaks any path containing one.
path_separator = os

# Migrations are named by what they do, with a timestamp so `ls` orders them the
# way history does. The revision id remains the identifier; this is for humans.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# No [loggers]/[handlers]/[formatters] sections. `alembic/env.py` deliberately
# does not call `fileConfig()` -- see the comment there -- so anything here
# would be dead configuration that looks live, which is worse than absent.
