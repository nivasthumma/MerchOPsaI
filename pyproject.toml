[project]
name = "merchantops-agent"
version = "0.1.0"
description = "Control plane for an AI payments agent: policy, approval, verification."
requires-python = ">=3.12"

# These must live here, not only in api/requirements.txt. Vercel treats a
# pyproject.toml as the dependency source once it exists, so declaring the
# entrypoint below without declaring dependencies installed nothing and the
# function died on `import starlette` — a file added to fix routing broke
# packaging instead. Kept deliberately narrow: no pytest, no Streamlit, no
# Anthropic SDK. A serverless bundle pays for every one of them at cold start.
dependencies = [
  "fastapi>=0.141.1",
  "sqlalchemy>=2.0.52",
  "psycopg2-binary>=2.9.12",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.15.0",
  "pyyaml>=6.0.3",
]

# Vercel detects this repository as a FastAPI backend-framework project and
# needs to be told which ASGI callable to serve. Without it the build fails
# with "No FastAPI entrypoint found in default locations" — it can see several
# `app` variables (including the ones in tests) and refuses to guess.
[tool.vercel]
entrypoint = "api.index:app"

[tool.pytest.ini_options]
markers = [
  # Concurrency tests open real connections and commit, so they cost more than
  # the rolled-back majority. Deselect with: pytest -m "not slow"
  "slow: needs real connections and real commits (concurrency)",
]

# --------------------------------------------------------------------------
# Lint
# --------------------------------------------------------------------------
# The rule set is curated rather than "everything ruff knows", because a gate
# that fires on style nobody agreed to is a gate people learn to bypass. What
# is selected here either finds defects or finds the shapes that hide them --
# the first run flagged two methods silently redefining each other in the live
# payments adapter, and three dead locals in the recovery planner.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions", ".venv", "web", ".claude"]

[tool.ruff.lint]
select = [
  "F",      # pyflakes -- undefined names, unused imports, redefinitions
  "E", "W", # pycodestyle
  "I",      # import order
  "B",      # bugbear -- mutable defaults, shadowed loop vars, blind raises
  "S",      # bandit -- the security rules, which nothing else here covers
  "SIM",    # simplifications that change nesting, not taste
  "RUF",    # ruff's own correctness rules
  "PLE",    # pylint errors only. PLR/PLC are opinions about size and style.
  "UP",     # pyupgrade -- keeps 3.12 idiom consistent
]
ignore = [
  # FastAPI's entire dependency system is function calls in argument defaults:
  # `Depends()`, `Header()`, `Query()`. B008 is right about the general case
  # and wrong about every route in this repository.
  "B008",
  # Implicit string concatenation inside a collection. Used deliberately here
  # for long SQL and prose; the missing-comma bug it protects against is worth
  # catching, but ISC004 cannot tell the two apart and flags 29 intentional
  # ones.
  "ISC004",
  # Line length is reported by E501 and formatted by hand throughout. The
  # limit above documents intent without failing a build over a URL.
  "E501",

  # --- deferred, not dismissed -------------------------------------------
  # These fire on real style drift and none of them indicates a defect. They
  # are listed rather than fixed because the fixes are a wide mechanical diff
  # across files that carry the safety controls, and mixing that into the same
  # change as a concurrency fix makes both harder to review. Each is a
  # standalone cleanup: delete the line, run `ruff check --fix`, read the diff.
  "UP042",   # str+Enum -> StrEnum. Changes the type of every status value.
  "RUF059",  # unpacked-but-unused loop variables
  "RUF046",  # int() around something already an int
  "RUF015",  # list(...)[0] where next(iter(...)) would do
  "RUF007",  # zip(x, x[1:]) -> itertools.pairwise
  "SIM105",  # try/except/pass -> contextlib.suppress
  "SIM114",  # branches with identical bodies
  "SIM117",  # nested with statements
  "SIM222",  # `... or True`
  "E741",    # `l` as a name
  "E402",    # imports below module level -- deliberate in conftest and scripts
  "B017",    # pytest.raises(Exception) in one migration test
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on hardcoded credentials, call subprocesses, and use `assert`
# by definition. Bandit's rules for production code are noise here.
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607"]
"scripts/**" = ["S603", "S607"]   # deliberate, argument-list subprocess calls

# S608 (SQL built by interpolation), reviewed 2026-09-04 and safe in both:
#   app/metrics.py           `_percentile` interpolates its `sql` argument, and
#                            every caller passes a literal declared in the same
#                            module. Values bind through `params`.
#   app/tools/investigation  the interpolated fragment is one of two literals
#                            chosen by a boolean; the method binds as :meth.
#   app/detection/baselines  `utc` and `dow_expr` are EXTRACT expressions built
#                            three lines above the query. They are SQL
#                            structure, not values, so there is no bound form
#                            of them; merchant and method bind normally.
# None takes caller data into the query text. Listed here rather than as inline
# noqa because all three sites are multi-line f-strings, where the comment lands
# inside the SQL.
#
# Two sites that used to be here are gone rather than suppressed:
# `app/recovery/history.py` binds its status list with `= ANY(:settled)`, and
# `app/eval/runner.py` picks between its two timestamps with COALESCE over two
# bound parameters instead of splicing a fragment per branch.
"app/metrics.py" = ["S608"]
"app/tools/investigation.py" = ["S608"]
"app/detection/baselines.py" = ["S608"]
# app/tenancy.py builds the row-level-security DDL. The only interpolations are
# table and column names from module constants in that same file -- there is no
# bound form of a table name, and the values a caller supplies (tenant and
# merchant) go in through `set_config` parameters, never into this SQL.
"app/tenancy.py" = ["S608"]
# app/scim.py builds one WHERE clause from two literal fragments chosen by a
# validated filter (`userName eq` or `externalId eq`, nothing else parses). The
# value the caller supplied is bound; only the column choice is interpolated,
# and it is one of two constants in the same function.
"app/scim.py" = ["S608"]

# S607 (partial executable path): `subprocess.run(["ant", "auth", "status"])`
# resolves `ant` on PATH deliberately -- the CLI's install location is the
# user's business, and the call is already guarded by `shutil.which` and a
# timeout. An absolute path here would break the credential probe on every
# machine that installs the CLI somewhere else.
"app/config.py" = ["S607"]

# S105 (hardcoded password): `_WEBHOOK_SECRET` is the signing key the
# evaluation harness uses to sign its own synthetic webhook deliveries. It
# authenticates nothing outside the suite.
"app/eval/runner.py" = ["S105"]

# S311 (non-cryptographic RNG): the seed generator uses `random` with a fixed
# seed, and that is the requirement rather than an oversight -- the dataset has
# to reproduce byte-identically or no published evaluation number means
# anything. A cryptographic RNG would make it irreproducible.
"scripts/seed_data.py" = ["S311"]
