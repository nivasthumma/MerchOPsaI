<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="MerchantOps">
  <!-- The same mark the header draws: a gate, with something passing through
       it. Colours are literal rather than CSS variables — a favicon is loaded
       outside the document and never sees the app's tokens.

       The dark variant is not decoration: at 16px on a dark browser chrome the
       light mint ground disappears and the mark reads as a smudge. -->
  <style>
    .ground { fill: #E4F0EB; stroke: #B6D7C9; }
    .ink    { stroke: #175E4C; fill: none; stroke-width: 2.4;
              stroke-linecap: round; }
    .dot    { fill: #175E4C; }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #0C1F19; stroke: #1D3B31; }
      .ink    { stroke: #6FC3A3; }
      .dot    { fill: #6FC3A3; }
    }
  </style>
  <rect class="ground" x="1" y="1" width="30" height="30" rx="9" />
  <path class="ink" d="M8 21V11a4 4 0 0 1 8 0v10" />
  <path class="ink" d="M16 16h8" />
  <circle class="dot" cx="24" cy="16" r="2.4" />
</svg>
